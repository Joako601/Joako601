<svg xmlns="http://www.w3.org/2000/svg" width="450" height="286"
     viewBox="0 0 450 286">
  <style>
    text { font-family: 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
    .title { font-size: 16px; font-weight: 700; fill: #FCEFCB;
              filter: drop-shadow(0 0 4px rgba(242,169,59,0.45)); }
    .caption { font-size: 11px; fill: #6b6094; }
    .label { font-size: 13px; fill: #d8cdf0; }
    .value { font-size: 13px; font-weight: 700; fill: #F2A93B;
              filter: drop-shadow(0 0 3px rgba(242,169,59,0.35)); }

    .twinkle-a { animation: twinkle 2.5s ease-in-out infinite; }
    .twinkle-b { animation: twinkle 3.2s ease-in-out infinite; }
    .twinkle-c { animation: twinkle 4s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .28; } 50% { opacity: 1; } }

    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box;
              transform-origin: center; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }

    .spin { animation: rot 3.2s linear infinite; transform-box: fill-box;
             transform-origin: center; }
    @keyframes rot { to { transform: rotate(360deg); } }

    .reveal { opacity: 0; animation: fadeUp .6s ease-out forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); }
                          to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .twinkle-a, .twinkle-b, .twinkle-c, .pulse, .spin { animation: none; }
      .reveal { opacity: 1; animation: none; }
      .type-wrap { animation: none !important; clip-path: none !important; }
    }
  </style>
  <defs>
    <linearGradient id="stats-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0221"/>
      <stop offset="100%" stop-color="#1a0a3d"/>
    </linearGradient>
    <radialGradient id="stats-glow" cx="12%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#F2A93B" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F2A93B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="stats-clip"><rect width="450" height="286" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#stats-clip)">
    <rect width="450" height="286" fill="url(#stats-sky)"/>
    <rect width="450" height="286" fill="url(#stats-glow)"/>
    <g id="stats-bgstars"><circle cx="14" cy="261" r="1.0" fill="#FCEFCB" opacity="0.35" class="twinkle-a"/><circle cx="305" cy="206" r="1.3" fill="#F2A93B" opacity="0.35" class="twinkle-b"/><circle cx="428" cy="25" r="1.6" fill="#F2A93B" opacity="0.35" class="twinkle-c"/><circle cx="197" cy="208" r="1.0" fill="#F2A93B" opacity="0.35" class="twinkle-a"/><circle cx="104" cy="167" r="1.3" fill="#FCEFCB" opacity="0.35" class="twinkle-b"/><circle cx="125" cy="182" r="1.6" fill="#F2A93B" opacity="0.35" class="twinkle-c"/><circle cx="338" cy="183" r="1.0" fill="#F2A93B" opacity="0.35" class="twinkle-a"/><circle cx="377" cy="254" r="1.3" fill="#F2A93B" opacity="0.35" class="twinkle-b"/><circle cx="194" cy="241" r="1.6" fill="#FCEFCB" opacity="0.35" class="twinkle-c"/></g>
  </g>
  <rect x="0.5" y="0.5" width="449" height="285" rx="14"
        fill="none" stroke="#F2A93B" stroke-opacity="0.35"/>
  <g class="type-wrap" style="overflow:hidden;animation:type-stats 1s steps(23,end) 1 forwards">
    <text x="24" y="34" class="title">Joako601&apos;s GitHub Stats</text>
  </g>
  <style>@keyframes type-stats { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }</style>
  <g transform="translate(420,24)"><title>Se actualiza automáticamente todos los días</title><circle r="7" fill="none" stroke="#B084F2" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="16 26" class="spin"/><circle r="1.6" fill="#B084F2"/></g>
  
    <g class="reveal" style="animation-delay:0.15s">
      <g class="twinkle-a"><path d="M30 54.4 L31.1 58 L30 61.6 L28.9 58 Z" fill="#F2A93B"/><path d="M26.4 58 L30 59.1 L33.6 58 L30 56.9 Z" fill="#F2A93B"/></g>
      <text x="42" y="62" class="label">Repositorios públicos</text>
      <text x="426" y="62" class="value" text-anchor="end">24</text>
    </g>
    <g class="reveal" style="animation-delay:0.23s">
      <g class="twinkle-b"><path d="M30 88.4 L31.1 92 L30 95.6 L28.9 92 Z" fill="#F2A93B"/><path d="M26.4 92 L30 93.1 L33.6 92 L30 90.9 Z" fill="#F2A93B"/></g>
      <text x="42" y="96" class="label">Seguidores</text>
      <text x="426" y="96" class="value" text-anchor="end">10</text>
    </g>
    <g class="reveal" style="animation-delay:0.31s">
      <g class="twinkle-c"><path d="M30 122.4 L31.1 126 L30 129.6 L28.9 126 Z" fill="#F2A93B"/><path d="M26.4 126 L30 127.1 L33.6 126 L30 124.9 Z" fill="#F2A93B"/></g>
      <text x="42" y="130" class="label">Total de estrellas</text>
      <text x="426" y="130" class="value" text-anchor="end">3</text>
    </g>
    <g class="reveal" style="animation-delay:0.39s">
      <g class="twinkle-a"><path d="M30 156.4 L31.1 160 L30 163.6 L28.9 160 Z" fill="#F2A93B"/><path d="M26.4 160 L30 161.1 L33.6 160 L30 158.9 Z" fill="#F2A93B"/></g>
      <text x="42" y="164" class="label">Total de commits</text>
      <text x="426" y="164" class="value" text-anchor="end">421</text>
    </g>
    <g class="reveal" style="animation-delay:0.47s">
      <g class="twinkle-b"><path d="M30 190.4 L31.1 194 L30 197.6 L28.9 194 Z" fill="#F2A93B"/><path d="M26.4 194 L30 195.1 L33.6 194 L30 192.9 Z" fill="#F2A93B"/></g>
      <text x="42" y="198" class="label">Pull Requests</text>
      <text x="426" y="198" class="value" text-anchor="end">13</text>
    </g>
    <g class="reveal" style="animation-delay:0.55s">
      <g class="twinkle-c"><path d="M30 224.4 L31.1 228 L30 231.6 L28.9 228 Z" fill="#F2A93B"/><path d="M26.4 228 L30 229.1 L33.6 228 L30 226.9 Z" fill="#F2A93B"/></g>
      <text x="42" y="232" class="label">Issues</text>
      <text x="426" y="232" class="value" text-anchor="end">1</text>
    </g>
</svg>